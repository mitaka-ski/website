# Deploy Jekyll site to GitHub Pages (scheduled rebuilds for future-dated posts)
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 1月ツアー掲載: 2026-12-12 12:00 / 23:00 JST
    - cron: "0 3 12 12 *"
    - cron: "0 14 12 12 *"
    # 2月ツアー掲載: 2027-01-09 12:00 / 23:00 JST
    - cron: "0 3 9 1 *"
    - cron: "0 14 9 1 *"
    # 3月ツアー掲載: 2027-02-13 12:00 / 23:00 JST
    - cron: "0 3 13 2 *"
    - cron: "0 14 13 2 *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
