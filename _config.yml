title: 三鷹市スキー連盟
description: Ski Association of Mitaka
lang: ja
timezone: Asia/Tokyo

# 本番（カスタムドメイン）。preview URL に戻すときは url を github.io、baseurl を "/website"
url: "https://mitaka-ski.com"
baseurl: ""

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

header_pages:
  - about.md
  - events.md
  - join.md
  - skitour.md

minima:
  skin: classic

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
